<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Resume Studio</title>
<style>
@font-face{font-family:Inter;src:url('/preview/assets/fonts/Inter.woff2') format('woff2');font-display:swap}
:root{color-scheme:dark;--bg:#070a0f;--panel:#0d131d;--panel2:#111923;--line:#202c3b;--line2:#2c3c50;--text:#edf5ff;--muted:#8294aa;--a:#22d3ee;--b:#8b5cf6;--ok:#34d399;--warn:#fbbf24;--bad:#fb7185;--shadow:0 22px 70px #0007}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;font-family:Inter,ui-sans-serif,system-ui;background:radial-gradient(circle at 15% -10%,#16304e 0,transparent 35%),radial-gradient(circle at 75% 0,#21153e 0,transparent 28%),var(--bg);color:var(--text);overflow:hidden}button,input,textarea,select{font:inherit}button{color:inherit}
.topbar{height:64px;display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid var(--line);background:#080c12e8;backdrop-filter:blur(18px);position:relative;z-index:20}.logo{display:flex;align-items:center;gap:10px;min-width:220px}.mark{width:32px;height:32px;border:1px solid #2b4057;border-radius:10px;display:grid;place-items:center;background:linear-gradient(145deg,#112436,#0a0e15);font:700 13px ui-monospace;color:var(--a);box-shadow:inset 0 0 20px #22d3ee12}.logo strong{font-size:14px}.logo small{display:block;color:var(--muted);font-size:10px;margin-top:2px}.spacer{flex:1}.dirty{font:600 10px ui-monospace;color:var(--muted);padding:6px 8px;border:1px solid var(--line);border-radius:7px}.dirty.on{color:var(--warn);border-color:#fbbf2444;background:#fbbf240d}.toolbar{display:flex;gap:6px;align-items:center}.btn{border:1px solid var(--line);background:#111925;color:#c8d5e4;padding:8px 10px;border-radius:9px;cursor:pointer;transition:.18s}.btn:hover:not(:disabled){border-color:#3b536e;background:#152131;color:white}.btn:disabled{opacity:.35;cursor:not-allowed}.btn.primary{border:0;background:linear-gradient(135deg,var(--a),var(--b));color:#041019;font-weight:800}.btn.good{border-color:#34d3993a;color:#86efac}.btn.icon{width:36px;padding:8px 0}.btn.danger{color:#fda4af}.btn.ghost{background:transparent}.btn.mini{padding:6px 8px;font-size:11px;border-radius:7px}
.app{height:calc(100% - 64px);display:grid;grid-template-columns:220px minmax(430px,760px) minmax(390px,1fr)}.side{border-right:1px solid var(--line);background:#090e15b8;padding:14px 10px;overflow:auto}.search{position:relative;margin-bottom:13px}.search input{padding-left:31px}.search span{position:absolute;left:10px;top:9px;color:#587087;font-size:12px}.nav{display:grid;gap:4px}.nav button{border:0;background:transparent;color:#8ea0b6;padding:9px 10px;border-radius:8px;text-align:left;cursor:pointer;font-size:12px;display:flex;align-items:center;gap:9px}.nav button:hover,.nav button.on{background:#172131;color:#fff}.nav button.on{box-shadow:inset 2px 0 var(--a)}.nav i{font-style:normal;width:17px;color:#5f7892;font:600 10px ui-monospace}.side-foot{margin-top:18px;border-top:1px solid var(--line);padding:14px 8px;color:var(--muted);font-size:10px;line-height:1.6}.diag-mini{display:grid;gap:5px;margin-top:8px}.diag-mini span{display:flex;justify-content:space-between}.ok{color:var(--ok)}.bad{color:var(--bad)}
.editor{overflow:auto;padding:18px;background:linear-gradient(180deg,#0a0f17b8,transparent)}.section-head{display:flex;align-items:flex-end;justify-content:space-between;margin:0 0 13px}.section-head h1{font-size:20px;margin:0}.section-head p{margin:5px 0 0;color:var(--muted);font-size:11px}.stack{display:grid;gap:12px}.card{background:linear-gradient(180deg,#101822,#0c121b);border:1px solid var(--line);border-radius:15px;padding:14px;box-shadow:0 16px 45px #0003}.card-title{display:flex;align-items:center;gap:9px;margin-bottom:12px}.card-title h2{font-size:13px;margin:0}.card-title small{color:var(--muted);font-size:10px}.card-title .actions{margin-left:auto;display:flex;gap:5px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid.three{grid-template-columns:1fr 1fr 1fr}.full{grid-column:1/-1}label{display:grid;gap:6px;color:var(--muted);font-size:10px;letter-spacing:.01em}input,textarea,select{width:100%;border:1px solid #29384a;background:#080d14;color:var(--text);border-radius:9px;padding:9px 10px;outline:0;transition:.15s}textarea{min-height:92px;resize:vertical;line-height:1.55}input:focus,textarea:focus,select:focus{border-color:#22d3ee88;box-shadow:0 0 0 3px #22d3ee0d}.hintline{display:flex;justify-content:space-between;color:#52677e;font-size:9px}.list-editor{display:grid;gap:8px}.chips-input{font-family:ui-monospace,monospace}.add{width:100%;border-style:dashed;color:var(--a);margin-top:8px}.empty{padding:30px;text-align:center;color:var(--muted);border:1px dashed var(--line2);border-radius:12px}.json{min-height:68vh;font-family:ui-monospace,monospace;font-size:11px;tab-size:2}.banner{border:1px solid #fbbf243b;background:#fbbf240c;padding:10px 12px;border-radius:10px;color:#fde68a;font-size:11px;display:flex;gap:12px;align-items:center;margin-bottom:12px}.banner[hidden]{display:none}.banner .grow{flex:1}.pill{font:700 9px ui-monospace;padding:4px 6px;border-radius:999px;border:1px solid var(--line2);color:#91a4b8}.pill.ok{color:#86efac;border-color:#34d39933}.pill.warn{color:#fde68a;border-color:#fbbf2433}.validation{display:grid;gap:6px}.validation div{padding:8px 10px;border:1px solid #fb718533;border-radius:8px;color:#fecdd3;background:#fb71850a;font-size:11px}.theme-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.theme-choice{border:1px solid var(--line);border-radius:10px;background:#0a1018;padding:10px;text-align:left;cursor:pointer}.theme-choice.on{border-color:var(--a);box-shadow:0 0 0 2px #22d3ee13}.swatch{height:32px;border-radius:7px;margin-bottom:7px}.theme-choice b{font-size:10px}.backups{display:grid;gap:7px}.backup{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:9px;border:1px solid var(--line);border-radius:9px}.backup small{display:block;color:var(--muted);font-size:9px;margin-top:3px}
.preview{border-left:1px solid var(--line);background:#070a0f;display:grid;grid-template-rows:48px 1fr 118px;min-width:0}.preview-bar{display:flex;align-items:center;gap:6px;padding:0 10px;border-bottom:1px solid var(--line);background:#0a0f16}.preview-bar .seg{display:flex;border:1px solid var(--line);border-radius:8px;padding:2px}.preview-bar .seg button{border:0;background:transparent;color:#71859a;padding:6px 9px;border-radius:6px;font-size:10px;cursor:pointer}.preview-bar .seg button.on{background:#1a2635;color:#fff}.preview-bar .grow{flex:1}.frame-wrap{position:relative;min-height:0}.frame-wrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}.preview-state{position:absolute;inset:auto 12px 12px auto;background:#07101ad9;border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:600 9px ui-monospace;color:#8da4bb;pointer-events:none}.console{border-top:1px solid var(--line);padding:9px 11px;background:#090e15;overflow:auto;font:10px/1.55 ui-monospace;color:#7f93aa;white-space:pre-wrap}.console strong{color:#cbd5e1}.console .success{color:#86efac}.console .error{color:#fda4af}
.modal{position:fixed;inset:0;z-index:60;background:#02050a99;backdrop-filter:blur(6px);display:grid;place-items:center;padding:20px}.modal[hidden]{display:none}.dialog{width:min(620px,100%);max-height:80vh;overflow:auto;background:#0c121b;border:1px solid var(--line2);border-radius:16px;padding:16px;box-shadow:var(--shadow)}.dialog h2{margin:0 0 12px;font-size:16px}.dialog-foot{display:flex;justify-content:flex-end;gap:7px;margin-top:14px}
.seo-snippet{padding:16px;border:1px solid var(--line);border-radius:12px;background:#fff;color:#202124}.seo-snippet .seo-url{font:12px Arial,sans-serif;color:#202124;margin-bottom:4px}.seo-snippet h3{font:20px/1.3 Arial,sans-serif;font-weight:400;color:#1a0dab;margin:0 0 4px}.seo-snippet p{font:13px/1.5 Arial,sans-serif;color:#4d5156;margin:0}.url-list{display:grid;gap:5px}.url-list a{display:flex;justify-content:space-between;gap:12px;padding:8px 9px;border:1px solid var(--line);border-radius:8px;text-decoration:none;color:#aac2d8;font:10px ui-monospace;overflow-wrap:anywhere}.url-list a:hover{border-color:#22d3ee55;color:#fff}.seo-score{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.seo-score div{padding:10px;border:1px solid var(--line);border-radius:9px;background:#09111a}.seo-score b{display:block;color:#dff6ff;font-size:15px}.seo-score span{color:var(--muted);font-size:9px}.seo-note{padding:9px 10px;border:1px solid #22d3ee2e;background:#22d3ee09;border-radius:9px;color:#9bd7e2;font-size:10px;line-height:1.6}
@media(max-width:1180px){.app{grid-template-columns:190px 1fr}.preview{position:fixed;z-index:30;right:12px;bottom:12px;width:min(540px,calc(100vw - 24px));height:58vh;border:1px solid var(--line2);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);display:none}.preview.pop{display:grid}.topbar .preview-toggle{display:inline-block!important}}
@media(max-width:760px){body{overflow:auto}.topbar{position:sticky;top:0}.logo{min-width:0}.logo small,.toolbar .optional,.dirty{display:none}.app{height:auto;display:block}.side{position:sticky;top:64px;z-index:15;display:flex;gap:5px;overflow:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px;background:#080d14f2}.search,.side-foot{display:none}.nav{display:flex}.nav button{white-space:nowrap;padding:8px}.nav i{display:none}.editor{padding:12px}.grid,.grid.three{grid-template-columns:1fr}.theme-grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header class="topbar">
  <div class="logo"><div class="mark">$_</div><div><strong>Resume Studio</strong><small>local content workspace</small></div></div>
  <span id="dirty" class="dirty">SAVED</span>
  <div class="spacer"></div>
  <div class="toolbar">
    <button class="btn icon optional" id="undo" title="Undo (Ctrl+Z)">↶</button>
    <button class="btn icon optional" id="redo" title="Redo (Ctrl+Shift+Z)">↷</button>
    <button class="btn optional" id="validate">Validate</button>
    <button class="btn optional" id="build">Build</button>
    <button class="btn preview-toggle" id="previewToggle" style="display:none">Preview</button>
    <button class="btn primary" id="save">Save + Build</button>
  </div>
</header>
<div class="app">
  <aside class="side">
    <div class="search"><span>⌕</span><input id="navSearch" placeholder="Find a section…" /></div>
    <nav class="nav" id="nav">
      <button data-view="overview" class="on"><i>01</i>Overview</button>
      <button data-view="projects"><i>02</i>Projects</button>
      <button data-view="experience"><i>03</i>Experience</button>
      <button data-view="skills"><i>04</i>Skills</button>
      <button data-view="education"><i>05</i>Education</button>
      <button data-view="languages"><i>06</i>Languages</button>
      <button data-view="seo"><i>07</i>SEO & Pages</button>
      <button data-view="appearance"><i>08</i>Appearance</button>
      <button data-view="json"><i>09</i>JSON</button>
      <button data-view="backups"><i>10</i>Backups</button>
    </nav>
    <div class="side-foot">
      <b>Build health</b>
      <div class="diag-mini" id="diagMini"><span>site <b>…</b></span><span>pdf <b>…</b></span><span>backups <b>…</b></span></div>
    </div>
  </aside>
  <main class="editor">
    <div id="draftBanner" class="banner" hidden><span>Local draft found.</span><div class="grow">It has edits that are not in <code>resume.json</code>.</div><button class="btn mini" id="restoreDraft">Restore</button><button class="btn mini ghost" id="discardDraft">Discard</button></div>
    <section id="content"></section>
  </main>
  <aside class="preview" id="previewPane">
    <div class="preview-bar">
      <div class="seg"><button data-preview="3d" class="on">3D</button><button data-preview="pages">Pages</button><button data-preview="pdf">PDF</button></div>
      <div class="grow"></div>
      <button class="btn mini" id="refreshPreview">Refresh</button>
      <button class="btn mini" id="openPreview">↗ Open</button>
    </div>
    <div class="frame-wrap"><iframe id="frame" src="/preview/"></iframe><div class="preview-state" id="previewState">LIVE BUILD</div></div>
    <div class="console" id="console"><strong>Ready.</strong> Edit content, validate, then Save + Build.</div>
  </aside>
</div>
<input type="file" id="importFile" accept="application/json,.json" hidden />
<div class="modal" id="importModal" hidden><div class="dialog"><h2>Import JSON</h2><div id="importSummary"></div><div class="dialog-foot"><button class="btn" id="cancelImport">Cancel</button><button class="btn primary" id="confirmImport">Use imported data</button></div></div></div>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const clone=o=>JSON.parse(JSON.stringify(o));
const DRAFT_KEY='resume-studio.draft.v2';
let data=null, baseline='', currentView='overview', previewKind='3d', imported=null, history=[], future=[], historyTimer=0, suppressHistory=false;
const themes={midnight:['#0b1120','#22d3ee','#8b5cf6'],aurora:['#061713','#5eead4','#c084fc'],ember:['#190a10','#fb7185','#f59e0b'],matrix:['#020a05','#4ade80','#22c55e'],mono:['#08090b','#e2e8f0','#64748b'],ocean:['#031523','#38bdf8','#14b8a6'],synthwave:['#160b24','#f472b6','#22d3ee'],solar:['#160e05','#f59e0b','#ef4444']};

function serialize(){return JSON.stringify(data)}
function isDirty(){return serialize()!==baseline}
function setDirty(){const d=isDirty();$('#dirty').textContent=d?'UNSAVED':'SAVED';$('#dirty').classList.toggle('on',d);$('#undo').disabled=history.length<2;$('#redo').disabled=!future.length;if(d)localStorage.setItem(DRAFT_KEY,JSON.stringify({at:Date.now(),data}));else localStorage.removeItem(DRAFT_KEY)}
function snapshot(){if(suppressHistory)return;clearTimeout(historyTimer);historyTimer=setTimeout(()=>{const s=serialize();if(history.at(-1)!==s){history.push(s);if(history.length>80)history.shift();future=[]}setDirty()},180)}
function restoreState(s){suppressHistory=true;data=JSON.parse(s);render();suppressHistory=false;setDirty()}
function undo(){if(history.length<2)return;future.push(history.pop());restoreState(history.at(-1))}
function redo(){if(!future.length)return;const s=future.pop();history.push(s);restoreState(s)}
function setPath(path,val){let o=data,p=path.split('.');for(let i=0;i<p.length-1;i++)o=o[isNaN(p[i])?p[i]:Number(p[i])];const k=p.at(-1);o[isNaN(k)?k:Number(k)]=val;snapshot()}
function field(label,path,val,type='text',opts=''){const tag=type==='textarea'?'textarea':'input';return `<label>${label}<${tag} data-path="${path}" ${tag==='input'?`type="${type}" value="${esc(val)}" ${opts}`:''}>${tag==='textarea'?esc(val):''}</${tag}></label>`}
function selectField(label,path,val,items){return `<label>${label}<select data-path="${path}">${items.map(x=>`<option value="${esc(x)}" ${x===val?'selected':''}>${esc(x)}</option>`).join('')}</select></label>`}
function listField(label,path,arr,sep='\n'){return `<label>${label}<textarea data-list="${path}">${esc((arr||[]).join(sep))}</textarea><span class="hintline"><span>${sep==='\n'?'one item per line':'comma separated'}</span><span>${(arr||[]).length} items</span></span></label>`}
function head(title,desc,actions=''){return `<div class="section-head"><div><h1>${title}</h1><p>${desc}</p></div>${actions}</div>`}
function card(title,body,subtitle='',actions=''){return `<article class="card"><div class="card-title"><h2>${title}</h2>${subtitle?`<small>${subtitle}</small>`:''}<div class="actions">${actions}</div></div>${body}</article>`}
function actButtons(group,i,{duplicate=true}={}){return `<button class="btn mini" data-move="${group}" data-i="${i}" data-dir="-1" title="Move up">↑</button><button class="btn mini" data-move="${group}" data-i="${i}" data-dir="1" title="Move down">↓</button>${duplicate?`<button class="btn mini" data-dup="${group}" data-i="${i}" title="Duplicate">⧉</button>`:''}<button class="btn mini danger" data-remove="${group}" data-i="${i}">Remove</button>`}

function renderOverview(){const m=data.meta;return head('Overview','Core identity, links, profile and the short statement used across both outputs.')+`<div class="stack">${card('Identity',`<div class="grid">${field('Name','meta.name',m.name)}${field('Role / headline','meta.title',m.title)}${field('Email','meta.email',m.email,'email')}${field('Phone','meta.phone',m.phone)}${field('Location','meta.location',m.location)}${field('Availability','meta.availability',m.availability)}${field('Website','meta.website',m.website,'url')}${field('GitHub','meta.github',m.github,'url')}${field('Certificates','meta.certificates',m.certificates||'','url')}${selectField('Language','meta.language',m.language||'en',['en','fa'])}</div>`)}${card('Profile',`<div class="grid"><div class="full">${field('Professional summary','profile',data.profile,'textarea')}</div><div class="full">${field('Motto','motto',data.motto||'')}</div></div>`,'Keep the first 1–2 sentences recruiter-friendly.')}</div>`}
function renderProjects(){return head('Projects','The most important part of the resume. Reorder these to change their presentation order.',`<button class="btn" data-add="projects">+ Project</button>`)+`<div class="stack">${data.projects.map((p,i)=>card(p.title||`Project ${i+1}`,`<div class="grid three">${field('Title',`projects.${i}.title`,p.title)}${field('ID / slug',`projects.${i}.id`,p.id)}${field('Status',`projects.${i}.status`,p.status)}${selectField('Status style',`projects.${i}.status_kind`,p.status_kind||'dev',['ok','dev','thesis'])}${field('Repository / live URL',`projects.${i}.repo`,p.repo||'','url')}<div></div><div class="full">${listField('Stack',`projects.${i}.stack`,p.stack||[],', ')}</div><div class="full">${listField('Impact bullets',`projects.${i}.bullets`,p.bullets||[])}</div></div>`,`#${i+1}`,actButtons('projects',i))).join('')||'<div class="empty">No projects yet.</div>'}</div>`}
function renderExperience(){return head('Experience','Roles, organizations, dates and impact bullets.',`<button class="btn" data-add="experience">+ Experience</button>`)+`<div class="stack">${data.experience.map((e,i)=>card(e.role||`Experience ${i+1}`,`<div class="grid">${field('Role',`experience.${i}.role`,e.role)}${field('Period',`experience.${i}.period`,e.period)}${field('Organization',`experience.${i}.organization`,e.organization||'')}<div></div><div class="full">${listField('Bullets',`experience.${i}.bullets`,e.bullets||[])}</div></div>`,`#${i+1}`,actButtons('experience',i))).join('')||'<div class="empty">No experience items yet.</div>'}</div>`}
function renderSkills(){return head('Skills','Group related technologies. Shorter, meaningful groups scan better.',`<button class="btn" data-add="skills">+ Group</button>`)+`<div class="stack">${data.skills.map((g,i)=>card(g.group||`Group ${i+1}`,`<div class="grid"><div>${field('Group name',`skills.${i}.group`,g.group)}</div><div>${listField('Skills',`skills.${i}.items`,g.items||[],', ')}</div></div>`,`#${i+1}`,actButtons('skills',i))).join('')}</div>`}
function renderEducation(){return head('Education & learning','Formal education plus courses/certification learning.',`<button class="btn" data-add="education">+ Education</button>`)+`<div class="stack">${data.education.map((e,i)=>card(e.degree||`Education ${i+1}`,`<div class="grid">${field('Degree',`education.${i}.degree`,e.degree)}${field('Period',`education.${i}.period`,e.period)}<div class="full">${field('School',`education.${i}.school`,e.school)}</div></div>`,`#${i+1}`,actButtons('education',i))).join('')}${card('Continuous learning',listField('Courses / tracks','learning',data.learning||[]),'Used as compact checked items.')}</div>`}
function renderLanguages(){return head('Languages','Language proficiency shown as five visual levels.',`<button class="btn" data-add="languages">+ Language</button>`)+`<div class="stack">${data.languages.map((l,i)=>card(l.name||`Language ${i+1}`,`<div class="grid">${field('Language',`languages.${i}.name`,l.name)}${field('Level 1–5',`languages.${i}.level`,l.level,'number','min="1" max="5"')}</div>`,`#${i+1}`,actButtons('languages',i,{duplicate:false}))).join('')}</div>`}
function renderSEO(){const m=data.meta||{};const s=data.seo||(data.seo={site_url:'https://aasoftir.github.io/resume',site_name:(m.name||'Resume')+' · Software Developer',description:(data.profile||'').slice(0,158),locale:'en_US',indexing:true,keywords:[],google_site_verification:'',bing_site_verification:''});const base=(s.site_url||'').replace(/\/$/,'');const projectUrls=(data.projects||[]).map(p=>`${base}/projects/${p.id}/`);const pages=[`${base}/`,`${base}/about/`,`${base}/projects/`,...projectUrls,`${base}/experience/`,`${base}/skills/`,`${base}/education/`,`${base}/contact/`,`${base}/cv/`,`${base}/resume.pdf`];const title=s.site_name||`${m.name} · Software Developer`;const desc=s.description||data.profile||'';const titleOk=title.length>=20&&title.length<=65,descOk=desc.length>=80&&desc.length<=165,urlOk=/^https?:\/\//.test(base),verify=!!(s.google_site_verification||s.bing_site_verification);return head('SEO & crawlable pages','Everything here is compiled into the generated website: metadata, structured data, sitemap, social cards and real static pages.')+`<div class="stack">${card('Search identity',`<div class="grid">${field('Public site URL','seo.site_url',base,'url')}${field('Site name / default title','seo.site_name',title)}<div class="full">${field('Default search description','seo.description',desc,'textarea')}</div>${field('Open Graph locale','seo.locale',s.locale||'en_US')}<label>Search indexing<select data-bool="seo.indexing"><option value="true" ${s.indexing!==false?'selected':''}>index + follow</option><option value="false" ${s.indexing===false?'selected':''}>noindex (private/testing)</option></select></label><div class="full">${listField('Topic / entity keywords','seo.keywords',s.keywords||[])}</div></div>`,'These values feed canonical, Open Graph, Twitter Card and JSON-LD metadata.')}${card('Google result preview',`<div class="seo-snippet"><div class="seo-url">${esc(base||'https://example.com')} › resume</div><h3>${esc(title)}</h3><p>${esc(desc.slice(0,170))}</p></div><div class="seo-score" style="margin-top:10px"><div><b class="${titleOk?'ok':'bad'}">${title.length}</b><span>title chars · target 20–65</span></div><div><b class="${descOk?'ok':'bad'}">${desc.length}</b><span>description chars · target 80–165</span></div><div><b class="${urlOk?'ok':'bad'}">${urlOk?'OK':'FIX'}</b><span>absolute canonical URL</span></div><div><b class="${s.indexing!==false?'ok':'bad'}">${s.indexing!==false?'INDEX':'NOINDEX'}</b><span>robots policy</span></div></div>`,'Approximate snippet; Google may rewrite titles/descriptions.')}${card('Search Console verification',`<div class="grid">${field('Google verification token','seo.google_site_verification',s.google_site_verification||'')}${field('Bing verification token','seo.bing_site_verification',s.bing_site_verification||'')}</div><p class="seo-note" style="margin:10px 0 0">Paste only the token value from Google Search Console / Bing Webmaster Tools. After deployment the build places the verification meta tags on every public page. Verification is ${verify?'<b class="ok">configured</b>':'optional and currently empty'}.</p>`)}${card(`Generated pages · ${pages.length}`,`<div class="url-list">${pages.map((u,i)=>`<a href="${esc(u)}" target="_blank" rel="noopener"><span>${i===0?'3D home':i===1?'About':i===2?'Projects index':u.includes('/projects/')?(u.split('/').filter(Boolean).at(-1)||'Project'):u.endsWith('/resume.pdf')?'PDF':u.split('/').filter(Boolean).at(-1)||'Page'}</span><span>${esc(u)}</span></a>`).join('')}</div>`,'These are separate crawlable HTML routes and are automatically included in sitemap.xml.')}${card('Generated SEO assets',`<div class="grid"><label>Sitemap<input readonly value="${esc(base)}/sitemap.xml"></label><label>Robots<input readonly value="${esc(base)}/robots.txt"></label><label>Social card<input readonly value="${esc(base)}/assets/og-card.png"></label><label>Manifest<input readonly value="${esc(base)}/site.webmanifest"></label></div><p class="seo-note" style="margin:10px 0 0">Build also generates JSON-LD Person/ProfilePage/SoftwareSourceCode/Breadcrumb data, favicons, app icons, humans.txt, llms.txt, canonical URLs and social preview metadata.</p>`)}</div>`}
function renderAppearance(){const a=data.appearance||{};return head('Appearance','Defaults for the public 3D experience and generated PDF.')+`<div class="stack">${card('Theme',`<div class="theme-grid">${Object.entries(themes).map(([name,c])=>`<button class="theme-choice ${a.default_theme===name?'on':''}" data-theme-set="${name}"><div class="swatch" style="background:linear-gradient(135deg,${c.join(',')})"></div><b>${name}</b></button>`).join('')}</div><div class="grid" style="margin-top:12px">${selectField('Default 3D theme','appearance.default_theme',a.default_theme,Object.keys(themes))}${selectField('PDF theme','appearance.pdf_theme',a.pdf_theme,Object.keys(themes))}</div>`)}${card('Experience defaults',`<div class="grid">${selectField('Rendering quality','appearance.quality',a.quality||'auto',['auto','high','balanced','eco'])}${selectField('Intro behavior','appearance.intro',a.intro||'smart',['smart','always','skip'])}<label>Availability badge<select data-bool="appearance.show_availability"><option value="true" ${a.show_availability!==false?'selected':''}>shown</option><option value="false" ${a.show_availability===false?'selected':''}>hidden</option></select></label><label>Reader mode default<select data-bool="appearance.reader_default"><option value="false" ${!a.reader_default?'selected':''}>3D first</option><option value="true" ${a.reader_default?'selected':''}>reader first</option></select></label></div>`)}${card('Layout power-user note',`<p style="margin:0;color:var(--muted);font-size:11px;line-height:1.6">Precise 3D layer boxes and explode vectors remain editable in the JSON view. This keeps the normal editor safe while still allowing full scene composition control.</p>`)}</div>`}
function renderJson(){return head('Advanced JSON','Full source document. Useful for layout coordinates and bulk edits.',`<button class="btn" id="exportJson">Export JSON</button><button class="btn" id="importJson">Import JSON</button>`)+card('resume.json',`<textarea id="rawJson" class="json" spellcheck="false">${esc(JSON.stringify(data,null,2))}</textarea><div id="jsonErrors" class="validation" style="margin-top:10px"></div>`,'Changes here are parsed before switching away or saving.')}
async function renderBackups(){const items=await fetch('/api/backups').then(r=>r.json());const d=await fetch('/api/diagnostics').then(r=>r.json());return head('Backups & diagnostics','Local snapshots are created before each successful save. They are ignored by Git.')+`<div class="stack">${card('Diagnostics',`<div class="grid"><label>Python<input readonly value="${esc(d.python)}"></label><label>Git status<input readonly value="${esc(d.git)}"></label><label>Generated site<input readonly value="${d.site_built?Math.round(d.site_bytes/1024)+' KB':'missing'}"></label><label>Generated PDF<input readonly value="${d.pdf_built?Math.round(d.pdf_bytes/1024)+' KB':'missing'}"></label><label>Crawlable pages<input readonly value="${d.seo_pages||0}"></label><label>SEO system<input readonly value="${d.sitemap_built&&d.robots_built?'sitemap + robots ready':'incomplete'}"></label></div>`)}${card('Local versions',`<div class="backups">${items.map(x=>`<div class="backup"><div><b>${esc(x.name)}</b><small>${esc(x.modified)} · ${Math.round(x.size/1024)} KB</small></div><button class="btn mini" data-restore="${esc(x.name)}">Restore</button></div>`).join('')||'<div class="empty">No backups yet. Your first Save + Build will create one.</div>'}</div>`)}</div>`}

async function render(){let html='';if(currentView==='overview')html=renderOverview();if(currentView==='projects')html=renderProjects();if(currentView==='experience')html=renderExperience();if(currentView==='skills')html=renderSkills();if(currentView==='education')html=renderEducation();if(currentView==='languages')html=renderLanguages();if(currentView==='seo')html=renderSEO();if(currentView==='appearance')html=renderAppearance();if(currentView==='json')html=renderJson();if(currentView==='backups')html=await renderBackups();$('#content').innerHTML=html;bind();setDirty();updateDiagnostics()}
function parseJsonView(){const raw=$('#rawJson');if(!raw)return true;try{const parsed=JSON.parse(raw.value);data=parsed;$('#jsonErrors').innerHTML='';snapshot();return true}catch(e){$('#jsonErrors').innerHTML=`<div>${esc(e.message)}</div>`;return false}}
function bind(){
  $$('[data-path]').forEach(el=>el.oninput=()=>{const v=el.type==='number'?Number(el.value):el.value;setPath(el.dataset.path,v)});
  $$('[data-list]').forEach(el=>el.oninput=()=>{const sep=el.dataset.path.includes('stack')||el.dataset.path.includes('items')?',':'\n';setPath(el.dataset.list,el.value.split(sep).map(x=>x.trim()).filter(Boolean))});
  $$('[data-bool]').forEach(el=>el.onchange=()=>setPath(el.dataset.bool,el.value==='true'));
  $$('[data-remove]').forEach(b=>b.onclick=()=>{data[b.dataset.remove].splice(+b.dataset.i,1);snapshot();render()});
  $$('[data-move]').forEach(b=>b.onclick=()=>{const a=data[b.dataset.move],i=+b.dataset.i,j=i+(+b.dataset.dir);if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];snapshot();render()});
  $$('[data-dup]').forEach(b=>b.onclick=()=>{const a=data[b.dataset.dup],i=+b.dataset.i,n=clone(a[i]);if(n.id)n.id=n.id+'-copy';a.splice(i+1,0,n);snapshot();render()});
  $$('[data-add]').forEach(b=>b.onclick=()=>{const g=b.dataset.add;if(g==='projects')data.projects.push({id:'new-project',title:'New Project',status:'In development',status_kind:'dev',repo:'',stack:['Python'],bullets:['Describe the measurable result.']});if(g==='experience')data.experience.push({role:'Role',organization:'Organization',period:'2026',bullets:['Describe impact.']});if(g==='skills')data.skills.push({group:'New group',items:['Skill']});if(g==='education')data.education.push({degree:'Degree',school:'School',period:'Period'});if(g==='languages')data.languages.push({name:'Language',level:3});snapshot();render()});
  $$('[data-theme-set]').forEach(b=>b.onclick=()=>{setPath('appearance.default_theme',b.dataset.themeSet);render()});
  $$('[data-restore]').forEach(b=>b.onclick=()=>restoreBackup(b.dataset.restore));
  const raw=$('#rawJson');if(raw)raw.oninput=()=>{try{data=JSON.parse(raw.value);$('#jsonErrors').innerHTML='';snapshot()}catch(e){$('#jsonErrors').innerHTML=`<div>${esc(e.message)}</div>`}};
  $('#exportJson')?.addEventListener('click',exportJson);$('#importJson')?.addEventListener('click',()=>$('#importFile').click());
}
async function load(){data=await fetch('/api/resume').then(r=>r.json());baseline=JSON.stringify(data);history=[baseline];future=[];const d=localStorage.getItem(DRAFT_KEY);if(d){try{const parsed=JSON.parse(d);if(JSON.stringify(parsed.data)!==baseline)$('#draftBanner').hidden=false;else localStorage.removeItem(DRAFT_KEY)}catch{localStorage.removeItem(DRAFT_KEY)}}await render()}
async function validate(show=true){if(currentView==='json'&&!parseJsonView())return false;setConsole('Validating…');const r=await fetch('/api/validate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const x=await r.json();if(x.ok){setConsole('<span class="success">✓ Validation passed.</span>');if(show)flash('VALID','ok');return true}setConsole('<span class="error">✕ Validation failed</span>\n'+(x.errors||[]).join('\n'));flash('INVALID','bad');return false}
async function save(){if(!(await validate(false)))return;$('#save').disabled=true;setConsole('Saving JSON and rebuilding 3D + PDF…');try{const r=await fetch('/api/resume',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const x=await r.json();if(!x.ok)throw new Error((x.error||'Save failed')+'\n'+(x.log||''));baseline=serialize();history=[baseline];future=[];localStorage.removeItem(DRAFT_KEY);$('#draftBanner').hidden=true;setConsole('<span class="success">✓ Saved and rebuilt.</span>\n'+(x.log||''));refreshPreview();await updateDiagnostics();setDirty()}catch(e){setConsole('<span class="error">✕ '+esc(e.message)+'</span>')}finally{$('#save').disabled=false}}
async function build(){setConsole('Rebuilding current resume…');const r=await fetch('/api/build');const x=await r.json();setConsole(x.ok?'<span class="success">✓ Build complete.</span>\n'+x.log:'<span class="error">✕ Build failed.</span>\n'+(x.log||''));if(x.ok)refreshPreview();updateDiagnostics()}
function setConsole(html){$('#console').innerHTML=html}
function flash(text,cls=''){const e=$('#previewState');e.textContent=text;e.className='preview-state '+cls;setTimeout(()=>{e.textContent='LIVE BUILD';e.className='preview-state'},1300)}
function previewUrl(){return previewKind==='3d'?'/preview/':previewKind==='pages'?'/preview/projects/':'/preview/resume.pdf'}
function refreshPreview(){const base=previewUrl();$('#frame').src=base+(base.includes('?')?'&':'?')+'t='+Date.now()}
function exportJson(){const blob=new Blob([JSON.stringify(data,null,2)+'\n'],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='resume.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
async function restoreBackup(name){if(!confirm(`Restore ${name}? Current content will be backed up first.`))return;const r=await fetch('/api/restore',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})});const x=await r.json();if(!x.ok)return setConsole('<span class="error">✕ '+esc(x.error||'Restore failed')+'</span>');setConsole('<span class="success">✓ Backup restored and rebuilt.</span>');localStorage.removeItem(DRAFT_KEY);await load();refreshPreview()}
async function updateDiagnostics(){try{const d=await fetch('/api/diagnostics').then(r=>r.json());$('#diagMini').innerHTML=`<span>site <b class="${d.site_built?'ok':'bad'}">${d.site_built?'ready':'missing'}</b></span><span>pages <b class="${d.seo_pages?'ok':'bad'}">${d.seo_pages||0}</b></span><span>pdf <b class="${d.pdf_built?'ok':'bad'}">${d.pdf_built?'ready':'missing'}</b></span><span>backups <b>${d.backups}</b></span>`}catch{}}

$$('#nav [data-view]').forEach(b=>b.onclick=async()=>{if(currentView==='json'&&!parseJsonView())return;currentView=b.dataset.view;$$('#nav button').forEach(x=>x.classList.toggle('on',x===b));await render()});
$('#navSearch').oninput=e=>{const q=e.target.value.toLowerCase();$$('#nav button').forEach(b=>b.style.display=b.textContent.toLowerCase().includes(q)?'flex':'none')};
$$('[data-preview]').forEach(b=>b.onclick=()=>{previewKind=b.dataset.preview;$$('[data-preview]').forEach(x=>x.classList.toggle('on',x===b));refreshPreview()});
$('#refreshPreview').onclick=refreshPreview;$('#openPreview').onclick=()=>window.open(previewUrl(),'_blank');$('#previewToggle').onclick=()=>$('#previewPane').classList.toggle('pop');
$('#undo').onclick=undo;$('#redo').onclick=redo;$('#validate').onclick=()=>validate();$('#build').onclick=build;$('#save').onclick=save;
$('#restoreDraft').onclick=()=>{try{const d=JSON.parse(localStorage.getItem(DRAFT_KEY));data=d.data;history.push(serialize());$('#draftBanner').hidden=true;render();setDirty()}catch{}};$('#discardDraft').onclick=()=>{localStorage.removeItem(DRAFT_KEY);$('#draftBanner').hidden=true};
$('#importFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{imported=JSON.parse(await f.text());$('#importSummary').innerHTML=`<p style="color:var(--muted);font-size:11px">Loaded <b>${esc(f.name)}</b>.</p><pre style="white-space:pre-wrap;color:#9db0c4;font:10px ui-monospace">${esc(JSON.stringify({name:imported.meta?.name,projects:imported.projects?.length,experience:imported.experience?.length,skills:imported.skills?.length},null,2))}</pre>`;$('#importModal').hidden=false}catch(err){setConsole('<span class="error">✕ Invalid JSON: '+esc(err.message)+'</span>')}e.target.value=''};
$('#cancelImport').onclick=()=>{$('#importModal').hidden=true;imported=null};$('#confirmImport').onclick=()=>{if(imported){data=imported;history.push(serialize());future=[];snapshot();render()}$('#importModal').hidden=true;imported=null};
addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();save()}else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo()}else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'){e.preventDefault();redo()}});
addEventListener('beforeunload',e=>{if(isDirty()){e.preventDefault();e.returnValue=''}});
load();
</script>
</body>
</html>
